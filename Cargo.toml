[package]
name = "agent-echo"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Preserve complete coding-agent conversations as compressed native transcripts"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
