[package]
name = "agent-echo"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Preserve complete coding-agent conversations as compressed native transcripts"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
pulldown-cmark = { version = "0.13.4", default-features = false }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
toml = "0.9"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
