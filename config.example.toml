archive_root = "/absolute/path/to/vault/Agent Archives"
state_dir = "/absolute/path/to/local/agent-echo-state"
producer = "my-unique-machine-name"

# Defaults are CODEX_HOME or ~/.codex, and CLAUDE_CONFIG_DIR or ~/.claude.
# codex_home = "/absolute/path/to/.codex"
# claude_home = "/absolute/path/to/.claude"

# Omit to authorize only <codex_home>/attachments. [] disables attachment copies.
# attachment_roots = ["/absolute/path/to/.codex/attachments"]
max_attachment_bytes = 20000000
max_compressed_transcript_bytes = 200000000
